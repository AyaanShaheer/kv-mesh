# Main factorial sweep for the KV-Mesh manuscript.
#
# Design rationale (manuscript §5.3): one factor is varied at a time around a
# reference configuration so that effects remain attributable. The reference
# configuration is workers=4, capacity=8, heartbeat=3 s, TTL=10 s.
#
# Policies: affinity (KV-Mesh), roundrobin and leastloaded (baselines),
# oracle (upper bound, simulator-only, not deployable).
name: main-sweep
description: Policy x workload x worker-count x capacity x heartbeat-interval sweep

factors:
  n_workers: [1, 2, 4, 8]
  capacity: [2, 8, 32, 128]
  heartbeat_interval: [1.0, 3.0, 5.0]
  ttl: [10.0]

policies: [affinity, roundrobin, leastloaded, oracle]

workloads:
  exact_repeat:
    kind: exact_repeat
    n_keys: 64
    target_utilization: 0.5
  zipf:
    kind: zipf
    n_keys: 256
    zipf_s: 1.1
    target_utilization: 0.5
  uniform:
    kind: uniform
    n_keys: 4096
    target_utilization: 0.5

base:
  ttl: 10.0
  host_capacity: 64
  service_time: 0.005

repetitions: 5
n_requests: 10000

# Only these runs archive the raw per-request event stream. Everything else
# archives its summary, which contains all metrics used in the tables.
keep_records:
  - {n_workers: 4, capacity: 8, heartbeat_interval: 3.0}
